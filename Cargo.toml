[package]
name = "horizon-essentials"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Horizon Essentials: test harness for the bundle modules (cargo test), without compiling Horizon."

# The bundle modules are plain Rust: this crate assembles them under `crate::game::*`,
# exactly as the game sees them, to test them on the computer.
[lib]
path = "harness/lib.rs"

# The same versions as Horizon 9f42064's Cargo.lock: in the game, these crates are
# already dependencies of horizon-client, so the bundle adds none.
[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
