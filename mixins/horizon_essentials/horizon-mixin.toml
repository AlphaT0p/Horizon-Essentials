# Horizon Essentials : un seul bundle, plusieurs modules (un fichier par responsabilité).
# Préfixes : core_ (Core), ui_ (interface), mod_ (modules), profiles_ (profils), h_ (helpers).
[mod]
id = "horizon_essentials"
version = "0.1.0"
priority = 100

# Le commit testé : Nightly 2026-11-13. Seuls les hook points sont utilisés.
[compatibility]
horizon_revision = "9f42064c11efe7ef3e5ed2baad7ddc2a3b36eea0"

# ── Modules (Rust pur, testés par cargo test) ──────────────────────────────
[[module]]
id = "types"
file = "crates/horizon-client/src/game.rs"
name = "essentials_types"
visibility = "pub"
source = "core_types.rs"

[[module]]
id = "registry"
file = "crates/horizon-client/src/game.rs"
name = "essentials_registry"
visibility = "pub"
source = "core_registry.rs"

[[module]]
id = "config"
file = "crates/horizon-client/src/game.rs"
name = "essentials_config"
visibility = "pub"
source = "core_config.rs"

[[module]]
id = "store"
file = "crates/horizon-client/src/game.rs"
name = "essentials_store"
visibility = "pub"
source = "core_store.rs"

[[module]]
id = "state"
file = "crates/horizon-client/src/game.rs"
name = "essentials_state"
visibility = "pub"
source = "core_state.rs"

[[module]]
id = "events"
file = "crates/horizon-client/src/game.rs"
name = "essentials_events"
visibility = "pub"
source = "core_events.rs"

[[module]]
id = "draw"
file = "crates/horizon-client/src/game.rs"
name = "essentials_draw"
visibility = "pub"
source = "ui_draw.rs"

[[module]]
id = "status"
file = "crates/horizon-client/src/game.rs"
name = "essentials_status"
visibility = "pub"
source = "mod_status.rs"

# ── Helpers (un par hook) ───────────────────────────────────────────────────
[[injection]]
id = "frame"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_frame"
helper = "h_frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "elapsed", ty = "std::time::Duration", value = "elapsed" },
]

[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tick"
helper = "h_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "key"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_key"
helper = "h_key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

[[injection]]
id = "stopping"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_client_stopping"
helper = "h_stopping.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
]

[[injection]]
id = "hud"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_hud"
helper = "h_hud.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "corners", ty = "&mut horizon_client::extras_hud::Corners", value = "&mut *corners" },
]

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "h_list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]
