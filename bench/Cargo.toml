[package]
name = "horizon-essentials-bench"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Horizon Essentials performance measurement protocol (outside test mode, as in the game)."

# Programme indépendant : cargo run --release --manifest-path bench/Cargo.toml
[[bin]]
name = "bench"
path = "main.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[profile.release]
opt-level = 3
